# The Android version the JVM tests run as. One version, not a range: every
# extra one is another android-all jar to download and a slower suite, and what
# these tests check — a chevron opening a section, a gesture reaching the right
# handler — does not differ between versions.
#
# 35, the version the application is built against, so the tests run as the
# phone does.
sdk=35

# Compose draws for real rather than into a stub canvas, which is what makes
# layout and gestures behave as they do on a phone.
graphicsMode=NATIVE

# A plain Application, not VoiceApplication. VoiceApplication.onCreate loads
# libvoicecore.so, which is built for the phone's processor and cannot be loaded
# on this computer; and a test of one screen has no business starting the whole
# application, opening the database and reporting the timezone. A test that does
# need the real thing can say so with @Config(application = VoiceApplication::class)
# and supply a library.
application=android.app.Application
